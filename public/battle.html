<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChemQuest — Coin Battles</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/character.css" />
  <link rel="stylesheet" href="/css/pages.css" />
  <!-- the fight reuses the challenge question styles, like the quest player -->
  <link rel="stylesheet" href="/css/challenge.css" />
  <link rel="stylesheet" href="/css/quests.css" />
  <link rel="stylesheet" href="/css/battle.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo">🧪</span> ChemQuest</div>
    <div class="nav-actions">
      <span class="pill coins">🪙 <b id="navCoins">0</b> <span data-i18n="nav.coins">coins</span></span>
      <span class="pill points">⭐ <b id="navPoints">0</b> <span data-i18n="nav.pts">pts</span></span>
      <a class="btn ghost" href="/dashboard.html" data-i18n="nav.map">🗺️ Map</a>
      <a class="btn ghost" href="/quests.html" data-i18n="nav.quests">⚔️ Quests</a>
      <a class="btn secondary" href="/leaderboard.html" data-i18n="nav.leaderboard">🏆 Leaderboard</a>
      <button class="btn ghost" onclick="logout()" data-i18n="nav.logout">Log out</button>
    </div>
  </div>

  <div class="wrap">
    <div class="page-title">
      <h1 data-i18n="battle.title">🤺 Coin Battles</h1>
      <p class="page-sub" data-i18n="battle.sub">Answer your teacher's questions to win coins off a classmate.</p>
    </div>
    <div id="content"><p class="center muted" data-i18n="common.loading">Loading…</p></div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/character.js"></script>
  <script src="/js/qrender.js"></script>
  <script src="/js/battle.js"></script>
</body>
</html>
