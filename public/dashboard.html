<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoiVenture — Adventure Map</title>
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/quests.css" />
  <link rel="stylesheet" href="/css/character.css" />
  <link rel="stylesheet" href="/css/map.css" />
</head>
<body data-page="map">
  <div class="topbar"></div>

  <div class="wrap">
    <div class="map-head">
      <h1 data-i18n="dash.title">Your Chemistry Adventure 🗺️</h1>
      <div class="progress-wrap">
        <div class="progress-bar"><span id="progFill"></span></div>
        <div class="progress-label" id="progLabel" data-i18n="dash.loadingMap">Loading your map…</div>
      </div>
    </div>

    <div class="scene" id="scene" aria-label="Adventure map"></div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/character.js"></script>
  <script src="/js/mapart.js"></script>
  <script src="/js/dashboard.js"></script>
</body>
</html>
