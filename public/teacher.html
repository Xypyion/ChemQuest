<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoiVenture — Teacher Console</title>
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/teacher.css" />
  <link rel="stylesheet" href="/css/feed.css" />
</head>
<body class="teacher">
  <div class="t-shell">
    <aside class="t-side" id="side">
      <div class="t-brand"><span class="t-mark" id="brandMark"></span><span class="wordmark">Stoi<b>Venture</b></span></div>
      <div class="t-role" data-i18n="t.console">Teacher Console</div>
      <nav class="t-nav">
        <button data-view="lessons" data-icon="book" class="active" onclick="setView('lessons')" data-i18n="t.navLessons">Lessons &amp; Levels</button>
        <button data-view="challenges" data-icon="puzzle" onclick="setView('challenges')" data-i18n="t.navChallenges">Challenges</button>
        <button data-view="quests" data-icon="quests" onclick="setView('quests')" data-i18n="t.navQuests">Daily Quests</button>
        <button data-view="battles" data-icon="battle" onclick="setView('battles')" data-i18n="t.navBattles">Coin Battles</button>
        <button data-view="grading" data-icon="pen" onclick="setView('grading')" data-i18n="t.navGrading">Writing Grading</button>
        <button data-view="gradebook" data-icon="table" onclick="setView('gradebook')" data-i18n="t.navGradebook">Gradebook</button>
        <button data-view="students" data-icon="people" onclick="setView('students')" data-i18n="t.navStudents">Students</button>
        <button data-view="preview" data-icon="play" onclick="setView('preview')" data-i18n="t.playAsStudent">Play as student</button>
      </nav>
      <div id="langHost" style="margin:10px 0"></div>
      <div class="t-foot">
        <span data-i18n="t.signedInAs">Signed in as</span><br><b id="teacherName">Teacher</b>
        <button class="tbtn ghost t-logout" onclick="logout()" data-i18n="nav.logout">Log out</button>
      </div>
    </aside>

    <main class="t-main">
      <button class="tbtn ghost sm menu-toggle" onclick="document.getElementById('side').classList.toggle('open')" id="menuToggle"></button>
      <div id="view"></div>
    </main>
  </div>

  <div id="modalHost"></div>

  <script src="/js/i18n.js"></script>
  <script src="/js/icons.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/character.js"></script>
  <script src="/js/feed.js"></script>
  <script src="/js/teacher-challenges.js"></script>
  <script src="/js/teacher-quests.js"></script>
  <script src="/js/teacher-battles.js"></script>
  <script src="/js/teacher.js"></script>
</body>
</html>
