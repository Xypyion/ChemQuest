<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>StoiVenture — Chemistry Learning Adventure</title>
  <link rel="icon" href="/assets/logo-mark.svg" type="image/svg+xml" />
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Rubik:wght@400;500;600;700;800&family=Mitr:wght@400;500;600&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/login.css" />
</head>
<body class="login-page">
  <!-- Header: logo + language toggle -->
  <header class="login-header">
    <div class="login-brand">
      <span class="logo-mark" data-brand-mark="38" aria-hidden="true"></span>
      <span class="logo-text wordmark">Stoi<b>Venture</b></span>
    </div>
    <div class="login-lang" id="langHost"></div>
  </header>

  <!-- Login stage: waving mascot + entry card -->
  <main class="login-stage">
    <img class="login-mascot" src="/assets/mascot/wave.png" width="352" height="440"
         alt="" aria-hidden="true" />

    <div class="login-card">
      <!-- LOGIN ("Laboratory Entry") -->
      <form id="loginForm" autocomplete="on">
        <h1 data-i18n="welcome.labEntry">Laboratory Entry</h1>

        <div class="login-field">
          <label for="loginEmail" data-i18n="welcome.email">Email</label>
          <input id="loginEmail" type="email" placeholder="you@skn.ac.th" data-i18n-ph="welcome.emailPh" required />
        </div>
        <div class="login-field">
          <label for="loginPassword" data-i18n="welcome.password">Password</label>
          <input id="loginPassword" type="password" placeholder="Your password" data-i18n-ph="welcome.passwordPh" required />
        </div>

        <div class="login-error" id="loginErr"></div>
        <button class="login-cta" type="submit" data-i18n="welcome.start">START ADVENTURE</button>

        <div class="login-links">
          <a id="forgotLink" role="button" tabindex="0" data-i18n="welcome.forgot">Forgot password?</a><br />
          <a id="toSignup" role="button" tabindex="0" data-i18n="welcome.createAccount">Create new account</a>
        </div>
        <p class="login-teacher-hint" data-i18n="welcome.teacherHint">Teachers log in here too — you'll land in the Teacher Console.</p>
      </form>

      <!-- SIGN UP ("Create Explorer") — reachable via "Create new account" -->
      <form id="signupForm" class="hidden" autocomplete="on">
        <h1 data-i18n="welcome.createExplorer">Create Explorer</h1>

        <div class="login-field">
          <label for="suName" data-i18n="welcome.yourName">Your Name</label>
          <input id="suName" type="text" placeholder="e.g. Som Chai" data-i18n-ph="welcome.namePh" required />
        </div>
        <div class="login-field">
          <label for="suEmail" data-i18n="welcome.email">Email</label>
          <input id="suEmail" type="email" placeholder="you@skn.ac.th" data-i18n-ph="welcome.emailPh" required />
        </div>
        <div class="login-field">
          <label for="suPassword" data-i18n="welcome.password">Password</label>
          <input id="suPassword" type="password" placeholder="At least 6 characters" data-i18n-ph="welcome.passwordPh2" required />
        </div>

        <label data-i18n="welcome.chooseDiff">Choose your difficulty</label>
        <div class="diff-grid" id="diffGrid">
          <div class="diff sel" data-diff="easy">
            <div class="emoji">🌱</div><div class="name" data-i18n="welcome.easy">Easy</div><div class="desc" data-i18n="welcome.easyDesc">Gentle start</div>
          </div>
          <div class="diff" data-diff="medium">
            <div class="emoji">⛰️</div><div class="name" data-i18n="welcome.medium">Medium</div><div class="desc" data-i18n="welcome.mediumDesc">A real climb</div>
          </div>
          <div class="diff" data-diff="hard">
            <div class="emoji">🏔️</div><div class="name" data-i18n="welcome.hard">Hard</div><div class="desc" data-i18n="welcome.hardDesc">Summit challenge</div>
          </div>
        </div>

        <div class="login-error" id="signupErr"></div>
        <button class="login-cta" type="submit" data-i18n="welcome.create">Create Explorer 🎒</button>

        <div class="login-links">
          <a id="toLogin" role="button" tabindex="0" data-i18n="welcome.backToLogin">Back to login</a>
        </div>
      </form>
    </div>
  </main>

  <script src="/js/icons.js"></script>
  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/welcome.js"></script>
</body>
</html>
