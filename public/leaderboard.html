<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <title>ChemQuest — Leaderboard</title>
  <link rel="preconnect" href="https://fonts.googleapis.com" />
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin />
  <link href="https://fonts.googleapis.com/css2?family=Anuphan:wght@400;500;600;700&display=swap" rel="stylesheet" />
  <link rel="stylesheet" href="/css/theme.css" />
  <link rel="stylesheet" href="/css/character.css" />
  <link rel="stylesheet" href="/css/pages.css" />
</head>
<body>
  <div class="topbar">
    <div class="brand"><span class="logo" aria-hidden="true"><svg class="ic-lg" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round" stroke-linejoin="round"><path d="M9 3h6M10 3v6.5L4.6 18.2A2 2 0 0 0 6.3 21h11.4a2 2 0 0 0 1.7-2.8L14 9.5V3"/><path d="M7.2 15h9.6"/></svg></span> ChemQuest</div>
    <div class="nav-actions">
      <span class="pill points"><b id="navPoints">0</b> <span data-i18n="nav.pts">pts</span></span>
      <a class="btn ghost" href="/dashboard.html" data-i18n="nav.map">Map</a>
      <a class="btn grape" href="/inventory.html" data-i18n="nav.certificates">Certificates</a>
      <button class="btn ghost" onclick="logout()" data-i18n="nav.logout">Log out</button>
    </div>
  </div>

  <div class="wrap">
    <div class="page-title">
      <h1 data-i18n="lb.title">Explorer Leaderboard</h1>
      <p class="page-sub" data-i18n="lb.sub">Who's climbing highest? Earn points by completing levels!</p>
    </div>
    <div id="podium" class="podium"></div>
    <div id="list" class="lb-list"><p class="center muted" data-i18n="lb.loading">Loading rankings…</p></div>
  </div>

  <script src="/js/i18n.js"></script>
  <script src="/js/api.js"></script>
  <script src="/js/character.js"></script>
  <script src="/js/leaderboard.js"></script>
</body>
</html>
